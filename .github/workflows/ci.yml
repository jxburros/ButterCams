name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The recorder tests decode every file they produce with ffmpeg to
      # prove it plays without ButterCams software. They skip that check when
      # ffmpeg is missing, so a failed install does not fail the build.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install ffmpeg --no-progress -y

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal test web/embed.go)"

      - name: Vet
        run: go vet ./...

      - name: Vet for Windows
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -timeout 20m

  installer:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version "0.0.${{ github.run_number }}"

      # Exercise the same setup commands the installer runs, on a real
      # Windows machine: data root, registry, DPAPI, certificate, service
      # registration with recovery actions, firewall rule, start, stop, remove.
      - name: Smoke test the service on Windows
        shell: pwsh
        run: ./installer/smoke.ps1 -ExpectVersion "0.0.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ButterCams-installer
          path: dist/ButterCams-*-setup.exe
          if-no-files-found: error
