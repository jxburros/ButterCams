name: Release versions

# Checks release.json, .release/config.json and the versions embedded in the
# source, and that every change to main advances the version (see
# docs/RELEASING.md). Not run on pushes to other branches: there the previous
# push, not main, would be the base to advance from.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # The reference and toolkit-ref must be the same full commit of
    # JX-Holdings-LLC/release-infrastructure; .github/workflows/release.yml
    # pins the same one.
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/validate.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
